<!doctype html>
<html><head><meta charset="utf-8"><title>An ink-style story that keeps its earlier scenes</title></head>
<body>
<!-- The ink web export's shape: the game's title and byline in a .header inside #story, and every scene appended
below the last one. The scene is the newest heading of its level, never the game's title or the first scene. -->
<div id="story" class="container">
  <div class="header"><h1>My Game</h1><h2 class="byline">by Someone</h2></div>
  <h2>The Cellar</h2>
  <p>It is dark and smells of apples.</p>
  <h2>The Attic</h2>
  <p>Dust in the light from a round window.</p>
  <h3>A note</h3>
  <p>Someone wrote on the beam.</p>
  <p class="choice"><a href="#" onclick="return false">Read the note</a></p>
</div>
</body></html>
