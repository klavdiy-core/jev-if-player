<!doctype html>
<html><head><meta charset="utf-8"><title>Select puzzle with a hint</title></head>
<body>
<!-- Diner Detective shape: every list answered right, then Hint again and again, never Submit. -->
<main id="room"><p>The diner.</p></main>
<dialog id="modal">
  <p>Give each customer one meal. Nora ordered the only sweet meal.</p>
  <label>Nora <select id="nora"><option value="">Choose…</option><option value="pie">Pie</option><option value="stew">Stew</option></select></label>
  <label>Luis <select id="luis" aria-label="Luis"><option value="">Choose…</option><option value="pie">Pie</option><option value="stew">Stew</option></select></label>
  <p id="fb" role="status"></p><p id="fb2"></p>
  <button onclick="document.getElementById('fb').textContent='The window is shut.'">Check the window</button>
  <button onclick="var f=document.getElementById('fb'); f.textContent = f.textContent + ' Pie is sweet.';">Hint</button>
  <button onclick="if (document.getElementById('nora').value==='pie' && document.getElementById('luis').value==='stew') { document.getElementById('modal').close(); document.getElementById('room').innerHTML='<p>Solved. June pours coffee. THE END.</p>'; } else { document.getElementById('fb').textContent='Not quite.'; }">Submit answer</button>
</dialog>
<script>document.getElementById('modal').showModal();</script>
</body></html>
